run_id: qwenwmv3_hdf5_aloha_clean_random_la_sharla_a2a_eef_rot6d_foresight_soft_kl
run_root_dir: results/Checkpoints2
seed: 42
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

# QwenWMv3_LA foresight + soft_kl, RoboTwin EEF with rot6d model rotation.
# Packed action/state are 20D (xyz3 + rot6d6 + gripper1 per arm). HDF5 and
# the RoboTwin env stay on xyz + quaternion; conversion is in DataConfig.
# Requires a soft_kl episode cache (scripts/cache_sharla_soft_kl_episodes.sh);
# embedding norm_stats are not used in this mode.
framework:
  name: QwenWMv3_LA
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    freeze_vision_encoder: false
    train_expert_only: false
    gradient_checkpointing: false

  latent_action:
    enabled: true
    backend: sharla
    loss_type: soft_kl
    train_latent: true
    train_action: true
    latent_loss_weight: 0.1
    action_loss_weight: 1.0
    detach_vl_embs_for_action_head: false
    action_train_robot_types: ["aloha-agilex"]
    # Still required by DualStreamFlowMatchingWM parent init (unused by soft_kl head).
    latent_dim: 32
    codebook_size: 256
    sharla:
      config_path: /mnt/netdata/Team/Personal/zzt/models/sharla_a2a/config.yaml
      ckpt_path: /mnt/netdata/Team/Personal/zzt/models/sharla_a2a/partial_step_30000.pt
      image_size: [224, 224]
      strict_load: true
      kl_eps: 1.0e-08

  action_model:
    action_dim: 20
    state_dim: 20
    action_horizon: 32
    num_inference_timesteps: 20
    repeated_diffusion_steps: 8
    loss_type: fm
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    # Must equal frame_pairs * query_num (stride/horizon 8/32 => 4 pairs * 8 = 32).
    num_learnable_tokens: 32
    action_expert_attention: sdpa
    latent_expert_attention: flash
    action_dim_mask: null
    action_expert:
      hidden_size: 768
      intermediate_size: 2752
      num_attention_heads: 32
      num_key_value_heads: 8
      head_dim: 128
      num_layers: null
      adanorm_time: true
      final_norm_adanorm: false

datasets:
  vla_data:
    dataset_py: hdf5_la_dataset
    latent_action:
      enabled: true
      stride: 8
      horizon: 32
      video_keys: [cam_high]
      include_terminal_frame: true
      image_size: [224, 224]
      # Soft codebook distributions (not embedding cache).
      episode_cache_dir: .cache/latent_cache/sharla_soft_kl
      horizon_overrides:
        arx-x5:
          frame_stride: 6
          horizon: 24
    history_frame:
      enabled: true
      offset: 8
      video_keys: [cam_high]
    include_state: true
    data_root_dir: /mnt/netdata/Team/Personal/jjc/data/RoboTwin2.0/dataset
    data_mix: hdf5_aloha_clean_eef_rot6d
    latent_data_mix: hdf5_arx_clean_random_eef_rot6d
    hdf5_action_type: eef_rot6d
    action_type: abs_eef
    action_mode: abs
    per_device_batch_size: 8
    latent_per_device_batch_size: 8
    balance_dataset_weights: true
    balance_trajectory_weights: true
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    precompute_vlm_inputs: true

trainer:
  use_dual_vla_dataloaders: true
  dataloader_loss_modes:
    latent: latent
    action: joint
  dataloader_active_ranges:
    latent:
      - [0, null]
    action:
      - [0, null]
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  eval_num_samples: 1024
  eval_batch_size: 8
  logging_frequency: 50
  learning_rate:
    base: 5e-05
    action_model.qwenvl_with_expert.qwenvl: 2.0e-05
    action_model.qwenvl_with_expert.qwen_expert: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5e-6
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

# Offline soft_kl episode-cache builder (scripts/cache_sharla_soft_kl_episodes.sh).
soft_kl_cache:
  output_dir: .cache/latent_cache/sharla_soft_kl
  batch_size: 256
  num_workers: 128
  num_gpus: 8
  use_bf16: true
  overwrite: false
