run_id: qwenpiv3_la_softvq_hanging_mug
run_root_dir: results/Checkpoints2
seed: 42
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

# QwenPI_v3_LA with SoftVQ latent-action KL loss.
# Dual dataloaders split hanging_mug/aloha-agilex clean for action training
# and hanging_mug/aloha-agilex randomized for latent-action training.
framework:
  name: QwenPI_v3_LA
  latent_action:
    enabled: true
    backend: unit
    loss_type: ce
    train_latent: true
    train_action: true
    latent_loss_weight: 0.1
    action_loss_weight: 1.0
    action_train_robot_types: null
    groot_tokenizer_path: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/starVLA/third_party/UniT/outputs/robotwin_tokenizer/checkpoint-80000
    dinov2_path_override: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/models/dinov2-large
    num_bridge_tokens: 8
    num_codebooks: 2
    codebook_size: 128
    ce_loss_weights: [1.0, 0.5]
    label_smoothing: 0.0
    image_size: [224, 224]
    strict_num_bridge_tokens: true
    qwenpi_v4_la:
      token_format: "<latent_action_{i}>"
      head_dropout: 0.0
    softvq:
      config_path: starVLA/model/modules/latent_action/softvq_joint/0614_joint_aloha_xrecon_scratch.yaml
      ckpt_path: /inspire/qb-ilm/project/qproject-fundationmodel/public/jjc/exp/softla/0614_joint_aloha_xrecon_scratch/checkpoints/partial_step_100000.pt
      image_size: [224, 224]
      strict_load: true
      kl_eps: 1.0e-08
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2

  action_model:
    action_model_type: LayerwiseFM
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    action_horizon: 48
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 20
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_la_datasets
    latent_action:
      enabled: true
      stride: 16
      horizon: 48
      video_key: cam_high
      include_terminal_frame: true
      image_size: [224, 224]
    include_state: true
    data_root_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/data/RoboTwin2.0/lerobot
    data_mix: robotwin32_aloha_hanging_mug_clean
    latent_data_mix: robotwin32_aloha_hanging_mug_randomized
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 16
    latent_per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    video_backend: torchcodec

trainer:
  use_dual_vla_dataloaders: true
  dataloader_active_ranges:
    latent:
      - [0, null]
    action:
      - [0, null]
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  eval_num_samples: 512
  eval_batch_size: 16
  logging_frequency: 50
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  repeated_diffusion_steps: 8
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: true
