run_id: qwenwmv3_hdf5_aloha_clean_random_la_sharla_a2a_eef_foresight
run_root_dir: results/Checkpoints2
seed: 42
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

# QwenWMv3_LA on RoboTwin2.0 raw HDF5 aloha-agilex EEF data.
# Same v5 prefix-KV expert as QwenWMv2_LA, but latent prediction uses
# InternVLA-style learnable foresight tokens in a joint suffix with state
# and noisy actions (one expert forward, direct MSE to Sharla embeddings)
# instead of an independent latent flow-matching branch.
# action_expert_attention=sdpa: joint suffix has pi0 block-causal structure.
# latent_expert_attention=flash: latent-only path is a pure free-attention
# learnable-token block (fully valid, bidirectional), which fits flash.
# dataloader_loss_modes.action=joint => action dataloader computes BOTH
# action_dit_loss and latent_action_loss via joint foresight; latent
# dataloader remains latent-only (learnable tokens only, no state).
# Both streams need per-layer prefix K/V, so the two dataloaders' VLM forward
# passes are merged into one (see Qwen_WMv2_LA.supports_merged_dual_forward).
framework:
  name: QwenWMv3_LA
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    freeze_vision_encoder: false
    train_expert_only: false
    gradient_checkpointing: false

  latent_action:
    enabled: true
    backend: sharla
    # embedding: MSE on continuous Sharla embeddings (this config).
    # soft_kl: KL on codebook soft distributions (see *_foresight_soft_kl.yaml).
    loss_type: embedding
    train_latent: true
    train_action: true
    latent_loss_weight: 0.1
    action_loss_weight: 1.0
    detach_vl_embs_for_action_head: false
    action_train_robot_types: ["aloha-agilex"]
    # Sharla-a2a codebook_dim; validated against the encoder's actual
    # latent_dim at init (see Qwen_WMv2_LA._build_action_model).
    latent_dim: 32
    sharla:
      config_path: /mnt/netdata/Team/Personal/zzt/models/sharla_a2a/config.yaml
      ckpt_path: /mnt/netdata/Team/Personal/zzt/models/sharla_a2a/partial_step_30000.pt
      image_size: [224, 224]
      strict_load: true
      # Produced by scripts/cache_sharla_embeddings.py under embedding_cache.output_dir.
      norm_stats_path: .cache/latent_cache/sharla_a2a_embedding/latent_norm_stats.json

  action_model:
    action_dim: 16
    state_dim: 16
    action_horizon: 32
    num_inference_timesteps: 20
    repeated_diffusion_steps: 8
    loss_type: fm
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    # Must equal frame_pairs * query_num (stride/horizon 8/32 => 4 pairs * 8 = 32).
    # Runtime checks against latent_targets.shape[1]; mismatch raises.
    num_learnable_tokens: 32
    action_expert_attention: sdpa
    latent_expert_attention: flash
    action_dim_mask: null
    action_expert:
      # num_attention_heads/num_key_value_heads/head_dim must match the VLM's
      # text config exactly (each expert layer is conditioned on the matching
      # VLM layer's per-head K/V); hidden_size/intermediate_size are the
      # expert's own (independent) residual width.
      hidden_size: 768
      intermediate_size: 2752
      num_attention_heads: 16
      num_key_value_heads: 8
      head_dim: 128
      num_layers: null
      adanorm_time: true
      final_norm_adanorm: false

datasets:
  vla_data:
    dataset_py: hdf5_la_dataset
    latent_action:
      enabled: true
      stride: 8
      horizon: 32
      video_keys: [cam_high]
      include_terminal_frame: true
      image_size: [224, 224]
      # Optional: skip on-the-fly Sharla encode when the episode cache is present.
      embedding_cache_dir: .cache/latent_cache/sharla_a2a_embedding
      horizon_overrides:
        arx-x5:
          frame_stride: 6
          horizon: 24
    history_frame:
      enabled: true
      offset: 8
      video_keys: [cam_high]
    include_state: true
    data_root_dir: /mnt/netdata/Team/Personal/jjc/data/RoboTwin2.0/dataset
    data_mix: hdf5_aloha_clean_eef
    latent_data_mix: hdf5_arx_clean_random_eef
    hdf5_action_type: eef
    action_type: abs_eef
    action_mode: abs
    per_device_batch_size: 8
    latent_per_device_batch_size: 8
    balance_dataset_weights: true
    balance_trajectory_weights: true
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    precompute_vlm_inputs: true

trainer:
  use_dual_vla_dataloaders: true
  dataloader_loss_modes:
    latent: latent
    action: joint
  dataloader_active_ranges:
    latent:
      - [0, null]
    action:
      - [0, null]
  max_train_steps: 90000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  eval_num_samples: 512
  eval_batch_size: 8
  logging_frequency: 50
  learning_rate:
    base: 5e-05
    # v5 has no top-level `qwen_vl_interface`; the VLM/expert live nested under
    # `action_model.qwenvl_with_expert`.
    action_model.qwenvl_with_expert.qwenvl: 1.0e-05
    action_model.qwenvl_with_expert.qwen_expert: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5e-6
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

# Offline cache builder options (scripts/cache_sharla_embeddings.py).
embedding_cache:
  output_dir: .cache/latent_cache/sharla_a2a_embedding
  batch_size: 256
  num_workers: 128
  num_gpus: 8
  use_bf16: true
  overwrite: false
  compute_norm_stats: true
