run_id: qwenpiv5_hdf5_aloha_clean_eef_rot6d
run_root_dir: results/Checkpoints2
seed: 42
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

# QwenPI_v5 on RoboTwin2.0 raw HDF5 aloha-agilex clean EEF, with rot6d
# as the model-internal rotation (xyz3 + rot6d6 + gripper1 per arm = 20D).
# Env / HDF5 remain xyz + quaternion; the DataConfig converts at train/eval.
framework:
  name: QwenPI_v5
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    freeze_vision_encoder: false
    train_expert_only: false
    gradient_checkpointing: true

  action_model:
    action_dim: 20
    state_dim: 20
    action_horizon: 32
    num_inference_timesteps: 10
    repeated_diffusion_steps: 8
    loss_type: fm
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    expert_attention: flex
    action_dim_mask: null
    action_expert:
      hidden_size: 768
      intermediate_size: 2752
      # Must match the Qwen3-VL-2B text tower so prefix K/V concat cleanly.
      num_attention_heads: 16
      num_key_value_heads: 8
      head_dim: 128
      num_layers: null
      adanorm_time: true
      final_norm_adanorm: false

datasets:
  vla_data:
    dataset_py: hdf5_dataset
    include_state: true
    data_root_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/data/RoboTwin2.0/dataset
    data_mix: hdf5_aloha_clean_eef_rot6d
    hdf5_action_type: eef_rot6d
    hdf5_image_channel_order: bgr
    action_type: abs_eef
    action_mode: abs
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [256, 256]

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  eval_num_samples: 512
  eval_batch_size: 8
  logging_frequency: 50
  learning_rate:
    base: 5e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
