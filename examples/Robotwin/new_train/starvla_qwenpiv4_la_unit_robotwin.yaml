run_id: qwenpiv4_la_unit_robotwin
run_root_dir: results/Checkpoints
seed: 42
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

# QwenPI_v4_LA: QwenPI_v4 action head plus bridge-token latent-action CE loss.
# UniT targets use the local robotwin_tokenizer checkpoint-80000 directory.
framework:
  name: QwenPI_v4_LA
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2

  latent_action:
    enabled: true
    backend: unit
    loss_type: ce
    train_latent: true
    train_action: true
    latent_loss_weight: 0.1
    action_loss_weight: 1.0
    action_train_robot_types: ["aloha-agilex"]
    groot_tokenizer_path: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/starVLA/third_party/UniT/outputs/robotwin_tokenizer/checkpoint-80000
    dinov2_path_override: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/models/dinov2-large
    num_bridge_tokens: 8
    num_codebooks: 2
    codebook_size: 128
    ce_loss_weights: [1.0, 0.5]
    label_smoothing: 0.0
    image_size: [224, 224]
    strict_num_bridge_tokens: true
    qwenpi_v4_la:
      token_format: "<latent_action_{i}>"
      head_dropout: 0.0

  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 32
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 20
    diffusion_model_cfg:
      input_embedding_dim: 1024
      attention_head_dim: 32
      num_attention_heads: 32
      norm_type: "norm"
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_la_datasets
    latent_action:
      enabled: true
      stride: 16
      horizon: 32
      video_key: cam_high
      include_terminal_frame: true
      image_size: [224, 224]
      # horizon_overrides:
      #   arx-x5:
      #     frame_stride: 11
      #     horizon: 22
      #   franka:
      #     frame_stride: 11
      #     horizon: 22
      #   piper:
      #     frame_stride: 11
      #     horizon: 22
      #   ur5:
      #     frame_stride: 11
      #     horizon: 22
    # dynamic_sampling_weights:
    #   enabled: true
    #   schedules:
    #     - match: aloha-agilex
    #       steps: [0, 10000]
    #       weights: [3.0, 12.0]
    include_state: true
    data_root_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/data/RoboTwin2.0/lerobot
    data_mix: robotwin32_aloha_hanging_mug
    action_type: abs_qpos
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    video_backend: torchcodec

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  eval_num_samples: 512
  eval_batch_size: 16
  logging_frequency: 50
  learning_rate:
    base: 5e-05
    # qwen_vl_interface: 1e-05
    # action_model: 1e-04
    # latent_predictor: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
