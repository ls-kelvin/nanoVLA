run_id: qwenpiv4_la_softvq_robotwin
run_root_dir: results/Checkpoints
seed: 42
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

# QwenPI_v4_LA: QwenPI_v4 action head plus bridge-token latent-action KL loss.
# SoftVQ targets use the 0614 softla JointTokenizer and its vision.encode weights_v.
framework:
  name: QwenPI_v4_LA
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2

  latent_action:
    enabled: true
    backend: softvq
    loss_type: soft_kl
    train_latent: true
    train_action: true
    latent_loss_weight: 0.1
    action_loss_weight: 1.0
    action_train_robot_types: ["aloha-agilex"]
    num_bridge_tokens: 1
    num_codebooks: 1
    codebook_size: 64
    strict_num_bridge_tokens: true
    qwenpi_v4_la:
      token_format: "<latent_action_{i}>"
      head_dropout: 0.0
    softvq:
      config_path: starVLA/model/modules/latent_action/softvq_joint/0614_joint_aloha_xrecon_scratch.yaml
      ckpt_path: /inspire/qb-ilm/project/qproject-fundationmodel/public/jjc/exp/softla/0614_joint_aloha_xrecon_scratch/checkpoints/partial_step_100000.pt
      image_size: [224, 224]
      strict_load: true
      kl_eps: 1.0e-08

  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 32
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 20
    diffusion_model_cfg:
      input_embedding_dim: 1024
      attention_head_dim: 32
      num_attention_heads: 32
      norm_type: "norm"
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_la_datasets
    latent_action:
      enabled: true
      stride: 16
      horizon: 32
      video_key: cam_high
      include_terminal_frame: false
      image_size: [224, 224]
    include_state: true
    data_root_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/data/RoboTwin2.0/lerobot
    data_mix: robotwin32_aloha_place_phone_stand
    action_type: abs_qpos
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    video_backend: torchcodec

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  eval_num_samples: 512
  eval_batch_size: 16
  logging_frequency: 50
  learning_rate:
    base: 5e-05
    qwen_vl_interface: 1e-05
    action_model: 1e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
