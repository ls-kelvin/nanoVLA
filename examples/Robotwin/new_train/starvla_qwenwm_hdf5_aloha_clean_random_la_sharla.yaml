run_id: qwenwm_hdf5_aloha_clean_random_la_sharla_a2a_eef
run_root_dir: results/Checkpoints2
seed: 42
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.21"

# QwenWM_LA on RoboTwin2.0 raw HDF5 aloha-agilex EEF data.
# Latent and action are independent flow-matching streams sharing the DiT + VLM
# hidden states (separate final LayerNorms). Latent targets are Sharla-a2a
# post-quantize / pre-output_proj embeddings (codebook_dim=32), standardised by
# latent_norm_stats.json.
# dataloader_loss_modes.action=joint => action dataloader computes BOTH
# action_loss and latent_loss; latent dataloader remains latent-only.
# One-click multi-node cache + train (same env as qwenpiv5 launcher):
#   bash examples/Robotwin/new_train/run_robotwin_train_qwenwm_hdf5_aloha_clean_random_la_sharla.sh
framework:
  name: QwenWM_LA
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2

  latent_action:
    enabled: true
    backend: sharla
    train_latent: true
    train_action: true
    latent_loss_weight: 1.0
    action_loss_weight: 1.0
    detach_vl_embs_for_action_head: false
    action_train_robot_types: ["aloha-agilex"]
    sharla:
      config_path: /mnt/netdata/Team/Personal/zzt/models/sharla_a2a/config.yaml
      ckpt_path: /mnt/netdata/Team/Personal/zzt/models/sharla_a2a/partial_step_30000.pt
      image_size: [224, 224]
      strict_load: true
      # Produced by scripts/cache_sharla_embeddings.py under embedding_cache.output_dir.
      norm_stats_path: .cache/latent_cache/sharla_a2a_embedding/latent_norm_stats.json

  action_model:
    action_dim: 16
    state_dim: 16
    action_horizon: 32
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 20
    diffusion_model_cfg:
      input_embedding_dim: 1024
      attention_head_dim: 32
      num_attention_heads: 32
      norm_type: "norm"
      dropout: 0.0
      final_dropout: true
      interleave_self_attention: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: hdf5_la_dataset
    latent_action:
      enabled: true
      stride: 8
      horizon: 32
      video_keys: [cam_high]
      include_terminal_frame: true
      image_size: [224, 224]
      # Optional: skip on-the-fly Sharla encode when the episode cache is present.
      embedding_cache_dir: .cache/latent_cache/sharla_a2a_embedding
      horizon_overrides:
        arx-x5:
          frame_stride: 6
          horizon: 24
    history_frame:
      enabled: true
      offset: 8
      video_keys: [cam_high]
    include_state: true
    data_root_dir: /mnt/netdata/Team/Personal/jjc/data/RoboTwin2.0/dataset
    data_mix: hdf5_aloha_clean_eef
    latent_data_mix: hdf5_aloha_clean_random_eef
    hdf5_action_type: eef
    action_type: abs_eef
    action_mode: abs
    per_device_batch_size: 16
    latent_per_device_batch_size: 16
    balance_dataset_weights: true
    balance_trajectory_weights: true
    load_all_data_for_training: true
    obs_image_size: [256, 256]

trainer:
  use_dual_vla_dataloaders: true
  # action=joint: one forward yields both action_dit_loss and latent_action_loss.
  # latent=latent: latent-only forward on the secondary mix.
  dataloader_loss_modes:
    action: joint
    latent: latent
  dataloader_active_ranges:
    latent:
      - [0, null]
    action:
      - [0, null]
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  eval_num_samples: 512
  eval_batch_size: 16
  logging_frequency: 50
  learning_rate:
    base: 5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

# Offline cache builder options (scripts/cache_sharla_embeddings.py).
embedding_cache:
  output_dir: .cache/latent_cache/sharla_a2a_embedding
  batch_size: 256
  num_workers: 128
  num_gpus: 8
  use_bf16: true
  overwrite: false
  compute_norm_stats: true
