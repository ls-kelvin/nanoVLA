run_id: qwenact
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3_LA
  latent_action:
    backend: univla
    train_latent: true
    train_action: true
    action_train_robot_types: ["aloha-agilex"]
    univla:
      ckpt_path: ./playground/Pretrained_models/UniVLA/lam-stage-2.ckpt
    latent_loss_weight: 0.1
    action_loss_weight: 1.0
    latent_generation_max_extra_tokens: 30
    la_mask: False
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    # state_mode: where proprioceptive state is injected.
    #   "instruction"   -> discretised tokens appended to the prompt (π0.5-style, default)
    #   "action_expert" -> raw state fed to the Action DiT as a conditioning token
    state_mode: action_expert
    action_horizon: 50
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 20
    num_target_vision_tokens: 0
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_la_datasets
    latent_action:
      enabled: true
      stride: 10
      video_key: cam_high
      include_terminal_frame: true
    include_state: true
    data_root_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/data/RoboTwin2.0/lerobot
    data_mix: robotwin2_non_franka_all
    action_type: abs_qpos
    action_mode: abs
    # Optional: load action/state norm stats from a precomputed dataset_statistics.json
    # (same format saved at train end / used at inference) instead of computing them
    # over the dataset. norm_stats_key defaults to the embodiment tag / sole top-level key.
    # norm_stats_path: /path/to/dataset_statistics.json
    # norm_stats_key: new_embodiment
    norm_stats_path: ./results/Checkpoints/0601_robotwin_all_50_qwen3piv3_all/dataset_statistics.json
    sequential_step_sampling: False
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav

trainer:
  max_train_steps: 1000000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  repeated_diffusion_steps: 8
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: true
