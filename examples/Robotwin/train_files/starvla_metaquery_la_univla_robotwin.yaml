run_id: qwen_metaquery_la_univla_robotwin
run_root_dir: results/Checkpoints
seed: 42
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.1"

# QwenMetaQuery_LA with UniVLA latent-action AR loss.
# UniVLA targets are trained through the Qwen lm_head as action tokens, while
# metaquery tokens continue to condition the continuous action head.
framework:
  name: QwenMetaQuery_LA
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2

  metaquery:
    num_metaqueries: 64

  latent_action:
    enabled: true
    backend: univla
    loss_type: ar_lm
    mode: ar
    action_train_robot_types: ["aloha-agilex"]
    univla:
      ckpt_path: ./playground/Pretrained_models/UniVLA/lam-stage-2.ckpt
      image_size: [224, 224]
      strict_load: true
    token_format: "<robot_action_{i}>"
    num_bridge_tokens: 4
    num_codebooks: 1
    codebook_size: 16
    label_smoothing: 0.0
    loss_weight: 0.1
    action_loss_weight: 1.0
    strict_num_bridge_tokens: true

  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 32
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 32
    diffusion_model_cfg:
      input_embedding_dim: 1024
      attention_head_dim: 32
      num_attention_heads: 32
      norm_type: "norm"
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_la_datasets
    latent_action:
      enabled: true
      stride: 16
      video_key: cam_high
      include_terminal_frame: true
      image_size: [224, 224]
    include_state: true
    data_root_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/data/RoboTwin2.0/lerobot
    data_mix: robotwin32_aloha_place_phone_stand
    action_type: abs_qpos
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    video_backend: pyav

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  eval_num_samples: 256
  eval_batch_size: 8
  logging_frequency: 50
  learning_rate:
    base: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
