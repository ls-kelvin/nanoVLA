run_id: qwen_metaquery_robotwin
run_root_dir: results/Checkpoints
seed: 42
wandb_project: starVLA_Robotwin
is_debug: false
version_id: "0.1"

# ──────────────────────────────────────────────────────────────────────
# QwenMetaQuery: Mantis "loss为action" (metaquery) architecture in starVLA.
# Params follow Mantis configs/robotwin_all_wo_pretrain_image_action_eef_64_metaqueries.yaml.
# DiT cross_attention_dim / num_layers / output_dim are set at runtime by the
# framework (cross = VLM hidden, num_layers = VLM layers, output_dim = action_dim).
# ──────────────────────────────────────────────────────────────────────
framework:
  name: QwenMetaQuery
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2

  metaquery:
    num_metaqueries: 64

  action_model:
    action_dim: 14            # RoboTwin dual-arm eef (Mantis max_action_dim)
    state_dim: 14             # Mantis max_state_dim
    action_horizon: 32        # Mantis chunk_size — dataset must emit >=32 action steps
    add_pos_embed: True
    max_seq_len: 1024
    num_target_vision_tokens: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 32
    diffusion_model_cfg:
      input_embedding_dim: 1024
      attention_head_dim: 32
      num_attention_heads: 32
      norm_type: "norm"
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: true
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true                       # Mantis feeds state to the Action DiT
    data_root_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/data/RoboTwin2.0/lerobot
    data_mix: robotwin
    action_type: abs_qpos                      # must produce action_dim/state_dim = 16
    per_device_batch_size: 32                  # Mantis per_device_train_batch_size
    load_all_data_for_training: true
    obs_image_size: [256, 256]
    video_backend: pyav

# ──────────────────────────────────────────────────────────────────────
# Training settings — kept consistent with Mantis (筱晓):
#   adamw, lr 5e-5 (uniform), cosine_with_min_lr (min 5e-6), warmup 1000,
#   weight_decay 1e-8, betas (0.9,0.95), eps 1e-8, grad-clip 1.0,
#   grad-accum 1, bf16, DeepSpeed ZeRO-1, repeated_diffusion_steps 16.
# ──────────────────────────────────────────────────────────────────────
trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  logging_frequency: 50
  learning_rate:
    base: 5.0e-05                  # single uniform LR across all trainable modules
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-06
  freeze_modules: ''               # Mantis trains the VLM + action head (only vae frozen; no vae here)
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
