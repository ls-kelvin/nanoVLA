policy_name: model2robotwin_interface
task_name: null
task_config: null
ckpt_setting: null
seed: null
instruction_type: unseen

# StarVLA Client Parameters
host: "127.0.0.1"
port: 5694
unnorm_key: "new_embodiment"
action_mode: "abs"
# auto selects qpos for joint checkpoints and ee for endpose/eef checkpoints.
robotwin_action_type: "auto"
# Use "bgr" only for checkpoints trained on legacy HDF5 images encoded with swapped RGB/BGR channels.
image_channel_order: "rgb"
# null keeps the legacy behavior: refresh inference every action_chunk_size steps.
infer_every_steps: null

normalization_mode: "q99"  # options: min_max, q99

# History frame: prepend a frame from `offset` steps ago to the image list.
# 0 = disabled. key_index selects which camera (0 = head/cam_high).
# If fewer than `offset` steps of history are available, do not prepend.
history_frame_offset: 0
history_frame_key_index: 0
