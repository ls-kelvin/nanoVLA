model:
  vision:
    frame_encoder:
      type: cnn
      token_dim: 256
      patch_size: 16
    hidden_dim: 512
    embedding_dim: 128
    codebook_size: 64
    codebook_dim: 32
    enc_layers: 8
    enc_heads: 8
    dec_layers: 8
    dec_heads: 8
    dropout: 0.0
    l2_norm: true
    quant_temperature: 0.25
    entropy_temperature: 0.1
    mi_beta: 0.0002
    src_mask_ratio: 0.0
    reconstruction_target: pixel
    adv_beta: 0.0
  action:
    action_dim: 14
    state_dim: 14
    chunk_len: 16
    hidden_dim: 128
    embedding_dim: 128
    codebook_size: 64
    enc_layers: 4
    enc_heads: 4
    dec_layers: 4
    dec_heads: 4
    dropout: 0.0
    mi_beta: 0.0002
  joint:
    kl_beta: 0.0
    kl_form: sym_kl
    w_vision: 1.0
    w_action: 0.0
    w_cross_av: 1.0
    w_cross_va: 1.0
