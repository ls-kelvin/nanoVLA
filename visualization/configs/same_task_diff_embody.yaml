data_root_dir: /inspire/qb-ilm/project/qproject-fundationmodel/public/zzt/data/RoboTwin2.0/lerobot
seed: 42
max_samples_per_source: 2000
vectorize: flatten
pca_preprocess: 50          # optional; PCA preprocess before final projection
projection: tsne
tsne:
  perplexity: 30
  max_iter: 500
  learning_rate: auto
output: results/viz/same_task_diff_embody_2.png
wasserstein:
  output_matrix: results/viz/same_task_diff_embody_wasserstein.csv
  output_heatmap: results/viz/same_task_diff_embody_wasserstein_1.png
  max_samples_per_group: 2000
task: place_phone_stand
sources:
  - path: ${task}/aloha-agilex/clean
    robot_type: aloha_agilex
    group: aloha
  - path: ${task}/arx-x5/clean
    robot_type: arx_x5
    group: arx
  - path: ${task}/piper/clean
    robot_type: piper
    group: piper
  - path: ${task}/ur5/clean
    robot_type: ur5
    group: ur5
  - path: ${task}/franka/clean
    robot_type: franka
    group: franka
